<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <title>Pixel Pursuit</title>
  <style>
    :root { --bg:#0b1220; --hud:#0b1220e0; --gold:#e7c36a; }
    * { box-sizing: border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:#f4efe4; font-family: Trebuchet MS, system-ui, sans-serif; overflow:hidden; }
    canvas { display:block; image-rendering: pixelated; }
    .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px;
      background: linear-gradient(#000c,#0009), repeating-linear-gradient(0deg, transparent, transparent 2px, #0003 3px); z-index:5; }
    .overlay.hidden { display:none; }
    h1 { font-size: clamp(40px, 8vw, 72px); margin:0; letter-spacing:.06em; text-transform:uppercase; }
    p { max-width: 440px; color:#d7d0c4; }
    button { font: inherit; font-weight:800; letter-spacing:.14em; text-transform:uppercase; border:1px solid #e7c36a; background:#e7c36a; color:#1a1408; padding:12px 18px; margin:6px; border-radius:6px; }
    button.ghost { background:#0006; color:#f4efe4; border-color:#fff3; }
    #hud { position:fixed; left:12px; top:12px; z-index:4; background:var(--hud); border:1px solid #fff2; border-radius:8px; padding:8px 12px; }
    #hud b { font-size:22px; }
    #tools { position:fixed; right:12px; top:12px; z-index:4; display:flex; gap:6px; }
    #tools button { width:40px; height:40px; padding:0; margin:0; background:var(--hud); color:#fff; border-color:#fff3; }
    #obj { position:fixed; left:50%; bottom:18px; transform:translateX(-50%); z-index:4; background:#0008; border:1px solid #fff2; padding:8px 12px; border-radius:8px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    #pad { position:fixed; left:12px; bottom:12px; z-index:4; display:none; grid-template-columns: 48px 48px 48px; gap:4px; }
    #pad button, #run { width:48px; height:48px; margin:0; background:var(--hud); color:#fff; border-color:#fff3; }
    #run { position:fixed; right:16px; bottom:16px; z-index:4; display:none; width:64px; height:64px; border-radius:999px; }
    @media (pointer:coarse) { #pad { display:grid; } #run { display:grid; place-items:center; } }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><b id="clock">3:00</b><div id="meta">Beacons 0/3</div><div style="height:6px;width:140px;background:#fff2;margin-top:6px;border-radius:99px;overflow:hidden"><i id="stami" style="display:block;height:100%;width:100%;background:var(--gold)"></i></div></div>
  <div id="tools"><button id="help">?</button><button id="mute">🔊</button><button id="pause">❚❚</button></div>
  <div id="obj">Recover the trail beacon</div>
  <div id="pad">
    <span></span><button data-dx="0" data-dy="-1">▲</button><span></span>
    <button data-dx="-1" data-dy="0">◀</button><span></span><button data-dx="1" data-dy="0">▶</button>
    <span></span><button data-dx="0" data-dy="1">▼</button><span></span>
  </div>
  <button id="run">RUN</button>
  <div id="title" class="overlay">
    <div style="letter-spacing:.4em;color:var(--gold);font-size:12px;font-weight:800">PIXEL PURSUIT</div>
    <h1>One island.</h1>
    <p>A dirt road runs the spine of the jungle and stops at the south dock. Water lives on the south shore and the east river only. No path slamming into a random sea.</p>
    <p style="font-size:13px;opacity:.7">WASD move · Shift sprint · P pause</p>
    <div>
      <button id="goStd">Standard</button>
      <button class="ghost" id="goHard">Nightmare</button>
    </div>
  </div>
  <div id="end" class="overlay hidden">
    <h1 id="endTitle">Extracted</h1>
    <p id="endText"></p>
    <button id="again">Hunt again</button>
  </div>
<script>
const W=1536;
const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d");
const keys=new Set();
const pad={x:0,y:0,sprint:false};
let phase="title", muted=false, night=false, last=0, vw=innerWidth, vh=innerHeight;
let cam={x:400,y:0,z:1}, difficulty="standard", sim;
const GAME={walk:168,sprint:268,hide:92,stamMax:100,drain:28,regen:16,catch:34,shardR:36,hWalk:128,hChase:208,hSearch:150,seeDay:250,seeNight:160,seeHide:0.28,loseSight:2.5};
const spawn={x:768,y:220}, hunterSpawn={x:1180,y:220};
const extract={x:160,y:1180,w:280,h:220};
const hideZones=[{x:40,y:520,w:420,h:420},{x:60,y:60,w:220,h:180}];
const swamp={x:0,y:512,w:480,h:512};
const traps=[{x:1080,y:540,w:280,h:280}];
const water=[{x:0,y:1420,w:1536,h:116},{x:1320,y:860,w:216,h:580}];
const shards0=[{id:"trail",label:"Trail beacon",x:768,y:430},{id:"cross",label:"Crossroads beacon",x:768,y:768},{id:"dock",label:"Dock crate",x:980,y:1288}];
const patrol=[{x:1180,y:220},{x:1180,y:760},{x:768,y:760},{x:768,y:240},{x:260,y:760},{x:1100,y:1100}];
function inRect(p,r){return p.x>=r.x&&p.x<=r.x+r.w&&p.y>=r.y&&p.y<=r.y+r.h}
function inAny(p,rs){return rs.some(r=>inRect(p,r))}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function fmt(t){const s=Math.max(0,Math.ceil(t));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}
function createSim(diff){return{p:{...spawn,f:1,move:false,hide:false,stam:100,sprint:false},h:{...hunterSpawn,f:-1,state:"patrol",pi:1,last:null,lose:0},shards:shards0.map(s=>({...s,taken:false})),got:0,time:diff==="nightmare"?150:180,trap:0}}
const world=document.createElement("canvas"); world.width=W; world.height=W; const wctx=world.getContext("2d");
function paintWorld(isNight){
  const g=wctx;
  g.fillStyle=isNight?"#16301c":"#3c6b38"; g.fillRect(0,0,W,W);
  g.strokeStyle=isNight?"#5a4630":"#c4a36a"; g.lineWidth=54; g.lineCap="round";
  g.beginPath(); g.moveTo(768,80); g.lineTo(768,1320); g.stroke();
  g.beginPath(); g.moveTo(220,768); g.lineTo(1180,768); g.stroke();
  g.fillStyle=isNight?"#2a3340":"#6d7a6a"; g.fillRect(0,0,480,420);
  g.fillStyle=isNight?"#1b2830":"#8b9280"; for(let i=0;i<8;i++) g.fillRect(20+i*50,30+(i%3)*40,70,90);
  g.fillStyle=isNight?"#2b2430":"#6a7a52"; g.fillRect(1040,20,470,460);
  g.fillStyle=isNight?"#3a3048":"#8d7a62"; g.fillRect(1180,80,220,160);
  g.fillStyle=isNight?"#241828":"#5a4030"; g.fillRect(1220,70,140,28);
  g.fillStyle=isNight?"#1a2e24":"#2f5a40"; g.fillRect(0,512,500,520);
  g.fillStyle=isNight?"#244838":"#4a8a58"; for(let i=0;i<18;i++) g.fillRect(30+(i*47)%420,540+(i*31)%460,18,40);
  g.fillStyle=isNight?"#24301c":"#4a6234"; g.fillRect(1040,520,280,420);
  g.fillStyle=isNight?"#3a2818":"#7a5a3a"; g.fillRect(1120,600,90,70); g.fillRect(1240,680,70,60);
  g.fillStyle=isNight?"#1c2220":"#4a5a48"; g.fillRect(20,1040,460,380);
  g.fillStyle="#111"; g.beginPath(); g.ellipse(250,1280,70,48,0,0,Math.PI*2); g.fill();
  g.fillStyle=isNight?"#3a5040":"#7d9a6a"; g.fillRect(extract.x,extract.y,extract.w,extract.h);
  g.fillStyle=isNight?"#4a4030":"#d2c08a"; g.fillRect(480,1260,720,170);
  g.fillStyle=isNight?"#3a3228":"#8a6a40"; g.fillRect(720,1310,90,40);
  g.fillStyle=isNight?"#14344a":"#3a8ab0"; g.fillRect(1320,860,216,580); g.fillRect(0,1420,W,116);
  g.fillStyle=isNight?"#0e2438":"#2a6a90"; g.fillRect(0,1488,W,48);
  g.fillStyle=isNight?"#0e2214":"#245028";
  for(let y=120;y<1280;y+=70){ if(y>720&&y<820) continue; g.beginPath(); g.arc(700,y,16,0,7); g.fill(); g.beginPath(); g.arc(836,y+20,14,0,7); g.fill(); }
}
paintWorld(false);
function tone(freq,dur,type="square",gain=0.05){ if(muted) return; try{ const AC=window.AudioContext||window.webkitAudioContext; if(!tone.ctx) tone.ctx=new AC(); const c=tone.ctx,o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=freq; g.gain.setValueAtTime(0.0001,c.currentTime); g.gain.exponentialRampToValueAtTime(gain,c.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur+0.02);}catch(e){} }
function start(diff){ difficulty=diff; sim=createSim(diff); night=false; paintWorld(false); phase="play"; document.getElementById("title").classList.add("hidden"); document.getElementById("end").classList.add("hidden"); tone(220,.12,"sawtooth"); }
function end(win){ phase=win?"win":"lose"; document.getElementById("end").classList.remove("hidden"); document.getElementById("endTitle").textContent=win?"You made it out":(sim.time<=0?"The clock died":"Caught"); document.getElementById("endText").textContent=win?("Score "+Math.round(sim.time*10+sim.got*250)+" · beacons "+sim.got):("Beacons "+sim.got+"/3"); }
function step(dt){
  const s=sim; s.p.hide=inAny(s.p,hideZones); const inSw=inRect(s.p,swamp), inWa=inAny(s.p,water), inTr=inAny(s.p,traps);
  if(inTr&&s.trap<=0) s.trap=1.6; s.trap=Math.max(0,s.trap-dt);
  const want=(pad.sprint||keys.has("shift")||keys.has(" "))&&s.p.stam>4&&!s.p.hide;
  s.p.sprint=want; s.p.stam=clamp(s.p.stam+(want?-GAME.drain:GAME.regen)*dt,0,GAME.stamMax);
  let spd=want?GAME.sprint:GAME.walk; if(s.p.hide) spd=GAME.hide; if(inSw) spd*=0.72; if(s.trap>0) spd*=0.45; if(inWa) spd*=0.3;
  let ix=pad.x, iy=pad.y;
  if(keys.has("w")||keys.has("arrowup")) iy-=1; if(keys.has("s")||keys.has("arrowdown")) iy+=1; if(keys.has("a")||keys.has("arrowleft")) ix-=1; if(keys.has("d")||keys.has("arrowright")) ix+=1;
  const mag=Math.hypot(ix,iy);
  if(mag>0.12){ const nx=ix/mag, ny=iy/mag; const next={x:clamp(s.p.x+nx*spd*dt,18,W-18),y:clamp(s.p.y+ny*spd*dt,18,W-18)};
    if(!inAny(next,water)||inWa){ s.p.x=next.x; s.p.y=next.y; } else { const sx={x:clamp(s.p.x+nx*spd*dt,18,W-18),y:s.p.y}; const sy={x:s.p.x,y:clamp(s.p.y+ny*spd*dt,18,W-18)}; if(!inAny(sx,water)) s.p.x=sx.x; else if(!inAny(sy,water)) s.p.y=sy.y; }
    s.p.move=true; if(nx) s.p.f=nx>0?1:-1; } else s.p.move=false;
  for(const sh of s.shards){ if(!sh.taken&&dist(s.p,sh)<=GAME.shardR){ sh.taken=true; s.got++; tone(880,.1); } }
  if(!night&&s.time<=75){ night=true; paintWorld(true); }
  const vision=(night?GAME.seeNight:GAME.seeDay)*(difficulty==="nightmare"?1.18:1)*(s.p.hide&&!s.p.move?GAME.seeHide:1);
  const dh=dist(s.h,s.p); const canSee=dh<=vision&&!(s.p.hide&&!s.p.sprint&&dh>vision*0.55);
  if(canSee){ s.h.state="chase"; s.h.last={x:s.p.x,y:s.p.y}; s.h.lose=GAME.loseSight; } else if(s.h.state==="chase"){ s.h.lose-=dt; if(s.h.lose<=0) s.h.state="search"; }
  let hs=GAME.hWalk; if(s.h.state==="chase") hs=GAME.hChase*(difficulty==="nightmare"?1.12:1); if(s.h.state==="search") hs=GAME.hSearch;
  const dest=s.h.state==="chase"?s.p:(s.h.state==="search"&&s.h.last?s.h.last:patrol[s.h.pi%patrol.length]);
  const ddx=dest.x-s.h.x, ddy=dest.y-s.h.y, dd=Math.hypot(ddx,ddy)||1, stepL=hs*dt;
  if(dd<=stepL){ s.h.x=dest.x; s.h.y=dest.y; if(s.h.state==="search"){ s.h.state="patrol"; s.h.last=null; } else if(s.h.state==="patrol") s.h.pi++; }
  else { s.h.x+=ddx/dd*stepL; s.h.y+=ddy/dd*stepL; } if(Math.abs(ddx)>2) s.h.f=ddx>0?1:-1;
  s.time=Math.max(0,s.time-dt);
  if(dh<=GAME.catch&&!s.p.hide) end(false); else if(s.got>=3&&inRect(s.p,extract)) end(true); else if(s.time<=0) end(false);
}
function drawGuy(x,y,color,face,big){ const w=big?28:22,h=big?36:30; ctx.fillStyle="#0006"; ctx.beginPath(); ctx.ellipse(x,y+h*0.42,w*0.45,5,0,0,7); ctx.fill(); ctx.save(); ctx.translate(x,y); ctx.scale(face,1); ctx.fillStyle=color; ctx.fillRect(-w/2,-h+8,w,h-6); ctx.fillStyle=big?"#1a1020":"#e8d2a8"; ctx.fillRect(-w/2+4,-h,w-8,12); ctx.restore(); }
function render(){
  vw=innerWidth; vh=innerHeight; canvas.width=vw*devicePixelRatio; canvas.height=vh*devicePixelRatio; canvas.style.width=vw+"px"; canvas.style.height=vh+"px"; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  const playing=phase==="play"; const targetZ=playing?(vw<700?1.05:1.18):0.7; cam.z+=(targetZ-cam.z)*0.08;
  if(sim){ const tx=sim.p.x-vw/2/cam.z, ty=sim.p.y-vh/2/cam.z; cam.x+=(tx-cam.x)*0.12; cam.y+=(ty-cam.y)*0.12; cam.x=clamp(cam.x,0,W-vw/cam.z); cam.y=clamp(cam.y,0,W-vh/cam.z); }
  ctx.save(); ctx.translate(-cam.x*cam.z,-cam.y*cam.z); ctx.scale(cam.z,cam.z); ctx.drawImage(world,0,0);
  if(sim){ for(const sh of sim.shards){ if(sh.taken) continue; ctx.fillStyle="#f3c14a"; ctx.beginPath(); ctx.arc(sh.x,sh.y,8,0,7); ctx.fill(); }
    if(sim.got>=3){ ctx.strokeStyle="#8f8"; ctx.lineWidth=3; ctx.strokeRect(extract.x,extract.y,extract.w,extract.h); }
    drawGuy(sim.h.x,sim.h.y,sim.h.state==="chase"?"#6a2030":"#2a2430",sim.h.f,true);
    drawGuy(sim.p.x,sim.p.y,sim.p.hide?"#3a5a40":"#c45a2a",sim.p.f,false); }
  ctx.restore();
  const vig=night?0.62:0.16; const g=ctx.createRadialGradient(vw/2,vh/2,vw*0.2,vw/2,vh/2,vw*0.75); g.addColorStop(0,"transparent"); g.addColorStop(1,"rgba(0,0,0,"+vig+")"); ctx.fillStyle=g; ctx.fillRect(0,0,vw,vh);
  if(sim&&playing){ document.getElementById("clock").textContent=fmt(sim.time); document.getElementById("meta").textContent="Beacons "+sim.got+"/3 · "+(night?"Night":"Day"); document.getElementById("stami").style.width=sim.p.stam+"%"; const next=sim.shards.find(s=>!s.taken); document.getElementById("obj").textContent=next?("Next · "+next.label+" · "+sim.got+"/3"):"All beacons live — extract the southwest cave"; if(sim.h.state==="chase") document.getElementById("obj").textContent+=" · SPOTTED"; }
}
function loop(ts){ requestAnimationFrame(loop); const dt=Math.min(0.05,(ts-(last||ts))/1000); last=ts; if(phase==="play") step(dt); render(); }
requestAnimationFrame(loop);
addEventListener("keydown",e=>{ keys.add(e.key.toLowerCase()); if(["arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase())) e.preventDefault(); if(e.key.toLowerCase()==="p"||e.key==="Escape"){ if(phase==="play") phase="pause"; else if(phase==="pause") phase="play"; } if(e.key.toLowerCase()==="m"){ muted=!muted; document.getElementById("mute").textContent=muted?"🔇":"🔊"; } });
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase())); addEventListener("blur",()=>keys.clear());
document.getElementById("goStd").onclick=()=>start("standard"); document.getElementById("goHard").onclick=()=>start("nightmare"); document.getElementById("again").onclick=()=>start(difficulty);
document.getElementById("pause").onclick=()=>{ if(phase==="play") phase="pause"; else if(phase==="pause") phase="play"; };
document.getElementById("mute").onclick=()=>{ muted=!muted; document.getElementById("mute").textContent=muted?"🔇":"🔊"; };
document.getElementById("help").onclick=()=>alert("Dirt road = spine of the island.\nGold dots = beacons.\nWest dark green = swamp hide.\nBlack hole SW = cave extract.\nBlue = water only on south shore + east river.");
for(const b of document.querySelectorAll("#pad button")){ const dx=+b.dataset.dx, dy=+b.dataset.dy; const on=e=>{e.preventDefault(); pad.x+=dx; pad.y+=dy;}; const off=()=>{ pad.x-=dx; pad.y-=dy; }; b.addEventListener("pointerdown",on); b.addEventListener("pointerup",off); b.addEventListener("pointercancel",off); }
const run=document.getElementById("run"); run.onpointerdown=e=>{e.preventDefault(); pad.sprint=true;}; run.onpointerup=run.onpointercancel=()=>pad.sprint=false;
</script>
</body>
</html>
